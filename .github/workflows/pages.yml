name: Publish Potion Maker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the committed build
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare lossless texture verification on a clean runner
        run: |
          python -m pip install -r source/requirements-build.txt
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'source')
          from build_textures import texture_data_url, write_texture_report
          for costume in json.loads(Path('data/costumes.json').read_text())['entries']:
              texture = costume.get('texture', '')
              if texture.endswith('.png'):
                  texture_data_url((Path('assets/live2d') / costume['character'] / 'textures' / texture).resolve())
          write_texture_report()
          PY

      - name: Verify the offline build matches its sources
        run: node source/check-build.cjs

      - name: Prepare the site and update gh-pages
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/pmg-site"
          mirror="$RUNNER_TEMP/pmg-pages"
          mkdir -p "$site"
          cp Potion-Maker.html "$site/index.html"
          touch "$site/.nojekyll"
          git fetch origin gh-pages --depth=1
          git worktree add --detach "$mirror" FETCH_HEAD
          cp "$site/index.html" "$site/.nojekyll" "$mirror/"
          git -C "$mirror" config user.name 'github-actions[bot]'
          git -C "$mirror" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$mirror" add -- index.html .nojekyll
          if ! git -C "$mirror" diff --cached --quiet; then
            git -C "$mirror" commit -m "Publish Potion Maker from $GITHUB_SHA"
            git -C "$mirror" push origin HEAD:gh-pages
          fi

      # Token-authenticated branch pushes do not trigger Pages builds; deploy explicitly.
      - name: Upload the playable site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pmg-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
